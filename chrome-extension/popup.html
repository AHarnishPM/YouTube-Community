<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: Roboto, Arial, sans-serif;
        font-size: 13px;
        color: #0f0f0f;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 16px;
        font-weight: 500;
      }
      label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-weight: 500;
      }
      input[type="range"] {
        width: 100%;
        margin: 0 0 12px;
        accent-color: #f00;
      }
      .preview {
        display: flex;
        justify-content: center;
        padding: 12px;
        border-radius: 8px;
        background: #282828;
      }
      .preview-comment {
        padding: 0.4em 0.75em;
        border-radius: 0.6em;
        background-color: rgba(0, 0, 0, 0.6);
        color: #fff;
        line-height: 1.3;
      }
      .preview-author {
        font-size: 0.75em;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <h1>YouTube Community</h1>
    <label for="font-size">Comment size <span id="font-size-value"></span></label>
    <input id="font-size" type="range" min="12" max="32" step="1" />
    <div class="preview">
      <div class="preview-comment" id="preview">
        <div class="preview-author">@viewer</div>
        <div>1:30 that dog is so cute!</div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
