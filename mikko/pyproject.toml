[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-community-mikko"
version = "0.1.0"
description = "CS 4701 claim detection and reproducible evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["claim_detection*"]
